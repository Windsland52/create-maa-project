name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 22.13 is the declared floor (pnpm 11 requires it) and 24 is the current LTS. Testing both
        # is what keeps the floor honest instead of letting it drift upward unnoticed.
        node:
          - 22.13
          - 24
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: node --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm check

  cli-smoke:
    name: CLI smoke (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Create a minimal project
        env:
          CREATE_MAA_PROJECT_OCR_SOURCE: download
        run: >-
          node dist/index.js .ci-smoke-project
          --no-interactive
          --no-git
          --template pipeline
          --slug ci-smoke
          --name "CI Smoke"
      - name: Diagnose the generated project
        working-directory: .ci-smoke-project
        run: node ../dist/index.js --doctor
