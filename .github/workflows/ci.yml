name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 22.13 is the declared floor (pnpm 11 requires it) and 24 is the current LTS. Testing both
        # is what keeps the floor honest instead of letting it drift upward unnoticed.
        node:
          - 22.13
          - 24
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: node --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm check

  cli-smoke:
    name: CLI smoke (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Create a minimal project
        env:
          CREATE_MAA_PROJECT_OCR_SOURCE: download
        run: >-
          node dist/index.js .ci-smoke-project
          --no-interactive
          --no-git
          --template pipeline
          --slug ci-smoke
          --name "CI Smoke"
      - name: Diagnose the generated project
        working-directory: .ci-smoke-project
        run: node ../dist/index.js --doctor

  package-smoke:
    name: Package smoke (${{ matrix.target }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          # Cross-built from x86_64 so the "target interpreter cannot run here" fallback
          # (uv --target --python-platform) stays covered. Releases build this target on
          # ubuntu-24.04-arm instead.
          - target: linux-arm64
            os: ubuntu-latest
            cross: true
          - target: win-x64
            os: windows-latest
          - target: osx-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # The smoke must exercise the templates in this checkout: auto-update would otherwise hand
    # the command to the published CLI. (CI=true already disables it; be explicit anyway.)
    env:
      CREATE_MAA_PROJECT_AUTO_UPDATE: 0
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v9.0.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The GitHub add-on enables the MFAAvalonia runtime only; MXU packaging is covered by
      # the release tests, which build both GUI layouts.
      - name: Create an Agent project with GitHub automation
        env:
          CREATE_MAA_PROJECT_OCR_SOURCE: download
        run: >-
          node dist/index.js .ci-package-project
          --no-interactive
          --no-git
          --template agent
          --add github
          --slug ci-package
          --name "CI Package"
      # The create step installs the project dependencies already; install again with the
      # lockfile pinned so the smoke also proves the generated lock is consistent.
      - name: Install the generated project dependencies
        working-directory: .ci-package-project
        run: pnpm install --frozen-lockfile
      # CREATE_MAA_PROJECT_BIN makes the generated project use this checkout instead of
      # pnpm dlx, so the smoke exercises the templates in this pull request.
      - name: Synchronize the release runtime
        working-directory: .ci-package-project
        env:
          CREATE_MAA_PROJECT_RUNTIME_PLATFORM: ${{ matrix.target }}
          CREATE_MAA_PROJECT_BIN: node ${{ github.workspace }}/dist/index.js
          CREATE_MAA_PROJECT_OCR_SOURCE: download
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm sync:runtime
      - name: Build the release packages
        working-directory: .ci-package-project
        env:
          CREATE_MAA_PROJECT_RUNTIME_PLATFORM: ${{ matrix.target }}
        run: node tools/build-release.mjs --release-tag v0.0.0-ci-smoke
      # release.yml ships macOS MXU as a signed .app inside a dmg, so the osx leg exercises the
      # whole bundler chain end to end: enable the MXU runtime, rebuild the packages with it, then
      # bundle, sign, dmg and run the app read-only the way the release does.
      - name: Enable the MXU runtime for the bundle smoke
        if: runner.os == 'macOS'
        working-directory: .ci-package-project
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          const project = JSON.parse(fs.readFileSync('maa-project.json', 'utf8'));
          project.runtime = {...project.runtime, mxu: {enabled: true, channel: 'stable', version: ''}};
          fs.writeFileSync('maa-project.json', JSON.stringify(project, null, 4) + '\n');
          "
      - name: Synchronize the MXU runtime
        if: runner.os == 'macOS'
        working-directory: .ci-package-project
        env:
          CREATE_MAA_PROJECT_RUNTIME_PLATFORM: ${{ matrix.target }}
          CREATE_MAA_PROJECT_BIN: node ${{ github.workspace }}/dist/index.js
          CREATE_MAA_PROJECT_OCR_SOURCE: download
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm sync:runtime
      # build-release.mjs removes every dist/package-* before rebuilding, so this second run both
      # produces package-mxu and keeps the package-mfaa the verify steps below still assert.
      - name: Rebuild the release packages with MXU
        if: runner.os == 'macOS'
        working-directory: .ci-package-project
        env:
          CREATE_MAA_PROJECT_RUNTIME_PLATFORM: ${{ matrix.target }}
        run: node tools/build-release.mjs --release-tag v0.0.0-ci-smoke
      - name: Build and smoke the macOS app bundle
        if: runner.os == 'macOS'
        working-directory: .ci-package-project
        run: |
          set -euo pipefail
          # The project ships no logo.ico; wrap the PNG it does have into one so the bundler's
          # icon conversion path is exercised the way release.yml uses it.
          node --input-type=module -e "
          import fs from 'node:fs';
          const png = fs.readFileSync('resource/base/image/empty.png');
          const entry = Buffer.alloc(16);
          entry.writeUInt16LE(1, 4);
          entry.writeUInt16LE(32, 6);
          entry.writeUInt32LE(png.length, 8);
          entry.writeUInt32LE(22, 12);
          fs.writeFileSync('logo.ico', Buffer.concat([Buffer.from([0, 0, 1, 0, 1, 0]), entry, png]));
          "
          node tools/macos-app-bundle.mjs \
            --package dist/package-mxu \
            --app "dist/CI-Package.app" \
            --version v0.0.0-ci-smoke \
            --executable ci-package \
            --display-name "CI Package" \
            --icon logo.ico \
            --dmg "dist/CI-Package-macos-aarch64-v0.0.0-ci-smoke-MXU.dmg"
          test -x "dist/CI-Package.app/Contents/MacOS/ci-package"
          test -L "dist/CI-Package.app/Contents/MacOS/interface.json"
          test -d "dist/CI-Package.app/Contents/Resources/MXU-portable"
          test -s "dist/CI-Package-macos-aarch64-v0.0.0-ci-smoke-MXU.dmg"
          codesign --verify --strict --verbose=2 "dist/CI-Package.app"
          bash tools/ci/smoke-macos-app.sh "dist/CI-Package.app" "$RUNNER_TEMP/ci-package-app-smoke"
      - name: Verify the package (Windows)
        if: runner.os == 'Windows'
        working-directory: .ci-package-project
        shell: pwsh
        run: |
          $packageName = 'package-mfaa'
          $interface = Get-Content -LiteralPath "dist/$packageName/interface.json" -Raw | ConvertFrom-Json
          if ($interface.agent[0].child_exec -ne 'python/python.exe') {
            throw "Unexpected Agent child_exec: $($interface.agent[0].child_exec)"
          }
          if (($interface.agent[0].child_args -join ' ') -ne '-u agent/main.py') {
            throw "Unexpected Agent child_args: $($interface.agent[0].child_args -join ' ')"
          }

          $python = Join-Path (Resolve-Path "dist/$packageName").Path 'python\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) {
            throw "Embedded Python is missing: $python"
          }
          if (Test-Path -LiteralPath "dist/$packageName/requirements.txt") {
            throw 'Release package must not ship requirements.txt'
          }

          Push-Location "dist/$packageName"
          try {
            & $python -I -c 'import sys; sys.path.insert(0, "agent"); import maafw_paths; resolved = maafw_paths.ensure_maafw_binary_path(); assert resolved, "client MaaFramework runtime was not resolved"; import agent_runtime, custom; custom.register_all(); from maa.library import Library; print("embedded Python smoke passed:", Library.version(), Library.framework_libpath)'
            if ($LASTEXITCODE -ne 0) {
              throw 'Embedded Python import smoke failed'
            }
            & $python -I -m compileall -q agent
            if ($LASTEXITCODE -ne 0) {
              throw 'Agent compile smoke failed'
            }
          } finally {
            Pop-Location
          }
          Write-Host '[OK] win-x64 package'
      - name: Verify the package (Unix)
        if: runner.os != 'Windows'
        working-directory: .ci-package-project
        shell: bash
        run: |
          set -euo pipefail
          package_name='package-mfaa'
          package="dist/$package_name"
          agent_command="$(node --input-type=module -e "
          import fs from 'node:fs';
          const agent = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')).agent?.[0];
          console.log(agent ? agent.child_exec + '|' + (agent.child_args ?? []).join(' ') : '');
          " "$package/interface.json")"
          if [ "$agent_command" != 'python/bin/python3|-u agent/main.py' ]; then
            echo "[ERR] unexpected Agent command: $agent_command"
            exit 1
          fi

          interpreter="$package/python/bin/python3"
          if [ ! -f "$interpreter" ] || [ ! -x "$interpreter" ]; then
            echo "[ERR] embedded Python is missing or not executable: $interpreter"
            exit 1
          fi
          if [ -f "$package/requirements.txt" ] || [ -d "$package/deps" ]; then
            echo '[ERR] release package must not ship requirements.txt or a wheelhouse'
            exit 1
          fi

          if [ "${{ matrix.cross || 'false' }}" = 'true' ]; then
            echo "[OK] $package_name (cross-built; the target interpreter cannot run here)"
            exit 0
          fi

          (
            cd "$package"
            ./python/bin/python3 -I -c 'import sys; sys.path.insert(0, "agent"); import maafw_paths; resolved = maafw_paths.ensure_maafw_binary_path(); assert resolved, "client MaaFramework runtime was not resolved"; import agent_runtime, custom; custom.register_all(); from maa.library import Library; print("embedded Python smoke passed:", Library.version(), Library.framework_libpath)'
            ./python/bin/python3 -I -m compileall -q agent
          )
          echo "[OK] $package_name"
