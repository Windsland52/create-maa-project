name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: node scripts/sync-release-version.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Pack npm package
        run: mkdir -p dist/npm && pnpm pack --pack-destination dist/npm
      - name: Smoke npm package
        shell: bash
        run: |
          package="$(find dist/npm -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          if [[ -z "$package" ]]; then
            echo "npm package was not created" >&2
            exit 1
          fi
          smoke_root="$RUNNER_TEMP/npm-package-smoke"
          npm install --prefix "$smoke_root" --no-audit --no-fund "$PWD/$package"
          node scripts/smoke-cli-artifact.mjs "$smoke_root/node_modules/.bin/create-maa-project"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: dist/npm/*.tgz
          if-no-files-found: error

  sea:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            asset_os: win
            arch: x86_64
            binary: dist/sea/create-maa-project-win-x86_64.exe
          - runner: windows-11-arm
            asset_os: win
            arch: aarch64
            binary: dist/sea/create-maa-project-win-aarch64.exe
          - runner: ubuntu-latest
            asset_os: linux
            arch: x86_64
            binary: dist/sea/create-maa-project-linux-x86_64
          - runner: ubuntu-24.04-arm
            asset_os: linux
            arch: aarch64
            binary: dist/sea/create-maa-project-linux-aarch64
          - runner: macos-15-intel
            asset_os: macos
            arch: x86_64
            binary: dist/sea/create-maa-project-macos-x86_64
          - runner: macos-latest
            asset_os: macos
            arch: aarch64
            binary: dist/sea/create-maa-project-macos-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: node scripts/sync-release-version.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:sea
        env:
          CREATE_MAA_PROJECT_RELEASE_OS: ${{ matrix.asset_os }}
          CREATE_MAA_PROJECT_RELEASE_ARCH: ${{ matrix.arch }}
      - name: Smoke SEA binary
        run: node scripts/smoke-cli-artifact.mjs "${{ matrix.binary }}"
      - uses: actions/upload-artifact@v7
        with:
          name: sea-${{ matrix.asset_os }}-${{ matrix.arch }}
          path: dist/sea/create-maa-project-${{ matrix.asset_os }}-${{ matrix.arch }}*
          if-no-files-found: error

  release-manifest:
    needs: sea
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/sync-release-version.mjs
      - uses: actions/download-artifact@v7
        with:
          pattern: sea-*
          merge-multiple: true
          path: dist/release-assets
      - run: node scripts/create-release-manifest.mjs dist/release-assets dist/release/create-maa-project-manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-manifest
          path: dist/release/create-maa-project-manifest.json
          if-no-files-found: error

  git_cliff:
    name: Generate release notes
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Generate release notes
        shell: bash
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="2.13.1"
          archive="git-cliff-${version}-x86_64-unknown-linux-gnu.tar.gz"
          checksum="$archive.sha512"
          download_url="https://github.com/orhun/git-cliff/releases/download/v${version}"
          mkdir -p "$RUNNER_TEMP/git-cliff"
          curl -fsSL "$download_url/$archive" -o "$RUNNER_TEMP/$archive"
          curl -fsSL "$download_url/$checksum" -o "$RUNNER_TEMP/$checksum"
          (
            cd "$RUNNER_TEMP"
            sha512sum --check "$checksum"
          )
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/git-cliff"
          git_cliff="$(find "$RUNNER_TEMP/git-cliff" -type f -name git-cliff -perm -111 | head -n 1)"
          if [[ -z "$git_cliff" ]]; then
            echo "[ERR] git-cliff binary was not found after extraction"
            exit 1
          fi
          if ! previous_stable_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' HEAD^)"; then
            echo "[ERR] no previous stable release tag was found"
            exit 1
          fi
          echo "[INFO] Generating release notes for $previous_stable_tag..$GITHUB_REF_NAME"
          "$git_cliff" --config .github/cliff.toml "$previous_stable_tag..HEAD" --strip header --output CHANGES.md
      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: CHANGES.md

  github-release:
    needs: [release-manifest, git_cliff]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: sea-*
          merge-multiple: true
          path: dist/release
      - uses: actions/download-artifact@v7
        with:
          name: release-manifest
          path: dist/release
      - uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: dist/release-notes
      - uses: softprops/action-gh-release@v3
        with:
          body_path: dist/release-notes/CHANGES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/release/*

  npm:
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: npm-package
          path: dist/npm
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm publish dist/npm/*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    needs: github-release
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/sync-release-version.mjs
      - uses: actions/download-artifact@v7
        with:
          name: release-manifest
          path: .release
      - run: node scripts/prepare-pypi-release.mjs .release/create-maa-project-manifest.json
      - run: uv build
      - name: Smoke Python wheel
        shell: bash
        env:
          CREATE_MAA_PROJECT_CACHE: ${{ runner.temp }}/create-maa-project-pypi-smoke-cache
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          if [[ -z "$wheel" ]]; then
            echo "Python wheel was not created" >&2
            exit 1
          fi
          smoke_venv="$RUNNER_TEMP/pypi-wheel-smoke"
          uv venv "$smoke_venv"
          uv pip install --python "$smoke_venv/bin/python" "$wheel"
          node scripts/smoke-cli-artifact.mjs "$smoke_venv/bin/create-maa-project"
      - uses: pypa/gh-action-pypi-publish@release/v1
