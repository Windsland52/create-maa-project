name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  package:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          {{releaseTargetMatrix}}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        if: hashFiles('pyproject.toml') != ''
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v9.0.0
        if: hashFiles('pyproject.toml') != ''
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: {{nodeMajor}}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm check
      - run: pnpm check:py
        if: hashFiles('pyproject.toml') != ''
      # Dependabot's `uv` updates move `uv.lock` only, and the package installs from the exported
      # `requirements.txt`. Re-export from the lock here so a merged lockfile update reaches the
      # artifact without a manual `create-maa-project --update python-deps` in between.
      - name: Re-export Python requirements from uv.lock
        if: hashFiles('pyproject.toml') != ''
        run: >-
          uv export --frozen --format requirements-txt --no-hashes --no-emit-project
          --no-group dev --no-annotate --output-file requirements.txt
      - run: pnpm release:dry-run
        if: github.event_name == 'workflow_dispatch'
      - run: pnpm sync:runtime
        if: github.event_name != 'workflow_dispatch'
        env:
          CREATE_MAA_PROJECT_RUNTIME_PLATFORM: ${{ matrix.runtime_os }}-${{ matrix.runtime_arch }}
          GITHUB_TOKEN: ${{ github.token }}
      - run: node tools/build-release.mjs
        if: github.event_name != 'workflow_dispatch'
        env:
          CREATE_MAA_PROJECT_RUNTIME_PLATFORM: ${{ matrix.runtime_os }}-${{ matrix.runtime_arch }}
      - name: Apply app icon
        if: github.event_name != 'workflow_dispatch' && hashFiles('logo.ico') != ''
        shell: bash
        run: |
          for pkg_dir in dist/package-*; do
            [ -d "$pkg_dir" ] || continue
            gui=$(basename "$pkg_dir" | sed 's/^package-//')
            cp logo.ico "$pkg_dir/logo.ico"

            if [[ "${{ matrix.runtime_os }}" == "win" ]]; then
              if [ ! -f rcedit.exe ]; then
                rcedit_version="2.0.0"
                curl -fsSL "https://github.com/electron/rcedit/releases/download/v${rcedit_version}/rcedit-x64.exe" -o rcedit.exe
              fi
              echo "3e7801db1a5edbec91b49a24a094aad776cb4515488ea5a4ca2289c400eade2a  rcedit.exe" | sha256sum --check --strict
              exe="$(find "$pkg_dir" -maxdepth 1 -type f -name '*.exe' | head -n 1)"
              if [[ -n "$exe" ]]; then
                ./rcedit.exe "$exe" --set-icon logo.ico
                echo "[OK] Applied Windows executable icon: $exe ($gui)"
              else
                echo "[WARN] Windows executable was not found in $pkg_dir; skipped."
              fi
            fi
          done
      - name: Package
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          mkdir -p dist
          shopt -s nullglob
          package_dirs=(dist/package-*/)
          if (( ${#package_dirs[@]} == 0 )); then
            echo "[ERR] no release packages were generated"
            exit 1
          fi
          for pkg_dir in "${package_dirs[@]}"; do
            gui=$(basename "$pkg_dir" | sed 's/^package-//')
            # macOS runners resolve `shell: bash` to the system bash 3.2, which predates the
            # parameter-expansion case modifiers, so uppercase through tr instead.
            gui_upper="$(printf '%s' "$gui" | tr '[:lower:]' '[:upper:]')"
            # macOS MXU ships as {{releaseArtifactName}}.app inside a dmg, the shape MaaEnd publishes; MFAA
            # keeps the plain archive because it is a bare GUI binary.
            ext="${{ matrix.ext }}"
            if [[ "${{ matrix.artifact_os }}" == "macos" && "$gui" == "mxu" ]]; then
              ext="dmg"
            fi
            archive="{{releaseArtifactName}}-${{ matrix.artifact_os }}-${{ matrix.arch }}-${GITHUB_REF_NAME}-${gui_upper}.$ext"
            if [[ "$ext" == "dmg" ]]; then
              # An explicitly requested icon fails the build when it cannot be applied, so the flag
              # is only passed when the project actually ships a logo.ico.
              icon_args=()
              if [[ -f logo.ico ]]; then
                icon_args=(--icon logo.ico)
              fi
              node tools/macos-app-bundle.mjs \
                --package "$pkg_dir" \
                --app "dist/{{releaseArtifactName}}.app" \
                --version "$GITHUB_REF_NAME" \
                "${icon_args[@]+"${icon_args[@]}"}" \
                --dmg "dist/$archive"
              rm -rf "dist/{{releaseArtifactName}}.app"
            else
              (
                cd "$pkg_dir"
                if [[ "$ext" == "zip" ]]; then
                  7z a "../$archive" .
                else
                  tar -czf "../$archive" .
                  tar -tzvf "../$archive" > "../$archive.manifest"
                  if ! awk '$1 ~ /^-/ && $0 ~ /(^|\/)({{slug}}|MFAAvalonia|mxu|MaaPiCli|MaaAgentServer|maa-cli|python3?)$/ && $1 !~ /^-..x/ { print; bad=1 } END { exit bad }' "../$archive.manifest"; then
                    echo "[ERR] Unix archive is missing executable permission metadata"
                    exit 1
                  fi
                  echo "[OK] Unix archive executable metadata smoke passed"
                fi
              )
            fi
            rm -rf "$pkg_dir"
          done
          # Assert the exact asset set this target must produce: a GUI runtime whose package was
          # silently skipped (mxu on linux-arm64 is the only legitimate absence) would otherwise be
          # published as a complete release.
          expected_guis=( $(node --input-type=module -e "
          import fs from 'node:fs';
          const project = JSON.parse(fs.readFileSync('maa-project.json', 'utf8'));
          const names = [];
          if (project.runtime?.mfa?.enabled !== false) names.push('MFAA');
          if (project.runtime?.mxu?.enabled && '${{ matrix.runtime_os }}-${{ matrix.runtime_arch }}' !== 'linux-arm64') names.push('MXU');
          console.log(names.join(' '));
          ") )
          for gui_upper in "${expected_guis[@]}"; do
            ext="${{ matrix.ext }}"
            if [[ "${{ matrix.artifact_os }}" == "macos" && "$gui_upper" == "MXU" ]]; then
              ext="dmg"
            fi
            archive="{{releaseArtifactName}}-${{ matrix.artifact_os }}-${{ matrix.arch }}-${GITHUB_REF_NAME}-${gui_upper}.$ext"
            if [[ ! -f "dist/$archive" ]]; then
              echo "[ERR] expected release asset was not produced: $archive"
              exit 1
            fi
            echo "[OK] packaged release asset: $archive"
          done
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'workflow_dispatch'
        with:
          name: ${{ matrix.artifact_os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

{{gitCliffJob}}{{androidPackageJob}}  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: {{releaseNeeds}}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          {{releaseNotesInput}}
          files: |
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/*.dmg{{releaseApkAssets}}
      - name: Dispatch post-release hooks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type=create-maa-project-release \
            -f client_payload[tag]="$GITHUB_REF_NAME"
